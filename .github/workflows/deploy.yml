
name: deploy

on:
  push:
    branches:
      - main

# Evita que dos despliegues se ejecuten simultáneamente.
concurrency:
  group: pagosya-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Obtener el nombre de la imagen y el tag del commit.
      - name: Set image tag
        run: |
          echo "TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/pagosya-api" >> $GITHUB_ENV

      # 3. Construir la imagen Docker.
      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=$TAG \
            -t $IMAGE:$TAG \
            app/

      # 4. Levantar la API.
      - name: Start container
        run: |
          docker run -d \
            --name pagosya-api \
            -p 8080:8000 \
            $IMAGE:$TAG

      # 5. Comprobar que la API responde correctamente.
      - name: Smoke test
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/; then
              exit 0
            fi
            sleep 1
          done

          echo "Smoke test failed"
          exit 1

      # 6. Iniciar sesión en GitHub Container Registry.
      - name: Login to GHCR
        if: success()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 7. Publicar la imagen solamente si todo lo anterior pasó.
      - name: Push Docker image
        if: success()
        run: docker push $IMAGE:$TAG
